<!doctype html>
<html lang="ko">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iPhone / iPad 홈 화면 아이콘 -->
    <link
      rel="apple-touch-icon"
      href="/icons/bus_stop_icon_180x180.png"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default는 상단 상태바 영역을 웹뷰 밖 네이티브 OS 크롬으로 예약해
         버린다 — 그 영역은 우리 CSS가 전혀 닿을 수 없는 흰/밝은 고정
         배경이라, 앱 배경이 상태바까지 이어지는 풀블리드 요구사항과
         근본적으로 맞지 않는다(실기기에서 상단에 흰 띠로 확인됨).
         black-translucent로 돌아와 웹뷰가 상태바 아래까지 풀블리드로
         그려지게 한다. 이전에 이 값에서 겪은 하단 47px 죽은 영역은
         body/#root의 height 계산 방식(index.css의 -webkit-fill-available
         주석 참고)으로 해결을 시도한다 — position:fixed 구조 자체는
         유지한 채 height의 값 소스만 바꾼다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BUS STOP" />

    <!-- 앱 테마 색상 -->
    <meta name="theme-color" content="#2563eb" />

    <meta charset="UTF-8" />

    <!-- 브라우저 탭 아이콘 -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/bus_stop_icon_192x192.png"
    />

    <!-- TEST A 결과: viewport-fit=cover 유무는 47px 부족분이 상단/하단 중
         어디에 생기는지만 바꿨다(둘 다 동시에 없앨 순 없었다). cover를
         원복하고 다음 테스트(AuthScreen 자체 높이를 47px 늘려도 실제
         페인트가 늘어나는지)로 넘어간다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>BUS STOP - 전주 버스</title>

    <meta
      name="description"
      content="전주시 버스 노선 정보 및 실시간 도착 안내"
    />

    <!-- SNS 공유 이미지 -->
    <meta
      property="og:image"
      content="/icons/bus_stop_icon_512x512.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/icons/bus_stop_icon_512x512.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
