<!doctype html>
<html lang="ko">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iPhone / iPad 홈 화면 아이콘 -->
    <link
      rel="apple-touch-icon"
      href="/icons/bus_stop_icon_180x180.png"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="BUS STOP" />

    <!-- 앱 테마 색상 -->
    <meta name="theme-color" content="#2563eb" />

    <meta charset="UTF-8" />

    <!-- 브라우저 탭 아이콘 -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/bus_stop_icon_192x192.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>BUS STOP - 전주 버스</title>

    <meta
      name="description"
      content="전주시 버스 노선 정보 및 실시간 도착 안내"
    />

    <!-- SNS 공유 이미지 -->
    <meta
      property="og:image"
      content="/icons/bus_stop_icon_512x512.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/icons/bus_stop_icon_512x512.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
