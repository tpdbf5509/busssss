<!doctype html>
<html lang="ko">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iPhone / iPad 홈 화면 아이콘 -->
    <link
      rel="apple-touch-icon"
      href="/icons/bus_stop_icon_180x180.png"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 상태바 방식. 예전에는 black-translucent(앱을 상태바 밑까지 그림)였다.
         iOS 26 홈 화면 앱은 세로 길이를 상태바 높이만큼 짧게 잡는다(실측: 844pt
         화면에서 797pt). black-translucent면 앱이 화면 맨 위부터 그려져, 모자란
         47pt가 화면 맨 아래에 앱이 그릴 수 없는 흰 띠로 남았다. 높이·위치·넘침을
         어떻게 바꿔도 그 띠에는 아무것도 그려지지 않았고(2026-09 PR #23 실기기
         조사, 4단계에서 두 번 더 확인), 하단 탭도 그만큼 떠 있었다.
         이번에 default로 바꿨다. 앱이 상태바 아래부터 그려져 앱 아래끝이 화면
         맨 아래와 맞는다. 대신 상태바 줄은 앱이 그릴 수 없고 iOS가 아래
         theme-color로 칠한다. iOS는 이 값을 홈 화면에 추가할 때 읽는다 — 바꾸면
         홈 화면 앱을 다시 추가해야 반영된다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BUS STOP" />

    <!-- 앱 테마 색상. 홈 화면 앱에서는 상태바 줄의 바탕색이 된다(위 default).
         예전에는 브랜드 파랑(#2563eb)이었다. 이번에 머리글 바탕(canvas)과 같은
         값으로 바꿔 상태바와 머리글이 한 면으로 이어져 보이게 한다.
         manifest.json의 theme_color(첫 실행 화면용)는 그대로 둔다. -->
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <!-- 7단계 다크 모드. 기기 모드에 맞춘 위 두 값은 앱 설정을 읽기 전의 기본이고, 아래 작은
         스크립트와 main.tsx가 앱 설정(끄기 / 켜기 / 기기 설정 따르기)에 맞게 둘을 같은 값으로
         바꾼다. 이 스크립트가 없으면 다크를 켠 사람이 앱을 열 때마다 흰 화면이 한 번 번쩍인다
         (main.tsx는 CSS를 받은 뒤 실행된다). 저장 키와 값은 lib/appSettings.ts와 같아야 한다.
         iOS 홈 화면 앱은 theme-color를 홈 화면에 추가할 때 읽으므로, 바꾸면 앱을 다시 추가해야 한다. -->
    <script>
      (function () {
        try {
          var m = (JSON.parse(localStorage.getItem('busssss_settings_v1') || '{}') || {}).themeMode;
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          // 앱 설정이 기기 모드와 다르면 상태바·주소창 색도 앱 설정을 따른다.
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#0B1220' : '#F7F8FA');
        } catch (e) {}
      })();
    </script>

    <meta charset="UTF-8" />

    <!-- 브라우저 탭 아이콘 -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/bus_stop_icon_192x192.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>BUS STOP - 전주 버스</title>

    <meta
      name="description"
      content="전주시 버스 노선 정보 및 실시간 도착 안내"
    />

    <!-- SNS 공유 이미지 -->
    <meta
      property="og:image"
      content="/icons/bus_stop_icon_512x512.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/icons/bus_stop_icon_512x512.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
