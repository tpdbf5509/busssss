<!doctype html>
<html lang="ko">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iPhone / iPad 홈 화면 아이콘 -->
    <link
      rel="apple-touch-icon"
      href="/icons/bus_stop_icon_180x180.png"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent를 쓰면 안 된다. iOS 홈 화면 PWA에서 이 값은 콘텐츠를
         화면 맨 위(y=0)부터 그리게 하면서도 뷰포트 높이는 상태바 높이를 뺀
         값으로 보고한다. 그래서 화면 아래쪽에 상태바 높이만큼(이 기종 47px)
         페이지가 닿을 수 없는 죽은 영역이 남는다 — 실기기 프로브로 확인했다
         (body를 844px로 만들어도 797px 아래로는 아무것도 그려지지 않았다).
         default로 두면 웹뷰가 상태바 아래에 놓여 앱 하단이 화면 끝에 맞는다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BUS STOP" />

    <!-- 앱 테마 색상 -->
    <meta name="theme-color" content="#2563eb" />

    <meta charset="UTF-8" />

    <!-- 브라우저 탭 아이콘 -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/bus_stop_icon_192x192.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>BUS STOP - 전주 버스</title>

    <meta
      name="description"
      content="전주시 버스 노선 정보 및 실시간 도착 안내"
    />

    <!-- SNS 공유 이미지 -->
    <meta
      property="og:image"
      content="/icons/bus_stop_icon_512x512.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/icons/bus_stop_icon_512x512.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
