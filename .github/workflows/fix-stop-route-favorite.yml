name: Apply stop-route favorite direction fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch RouteDetail favorite matching
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/screens/BusScreen.tsx")
          text = path.read_text(encoding="utf-8")

          old1 = '''const isArrivalFavorited = (stopName: string) =>
  state.favorites.some(
    (f) => f.type === "stop_route" && f.routeNumber === route.number && f.stopName === stopName
  );'''
          new1 = '''const isArrivalFavorited = (stopName: string) =>
  state.favorites.some(
    (f) =>
      f.type === "stop_route" &&
      f.appRouteId === route.id &&
      f.stopName === stopName
  );'''

          old2 = '''const existing = state.favorites.find(
    (f) => f.type === "stop_route" && f.routeNumber === route.number && f.stopName === stop.name
  );'''
          new2 = '''const existing = state.favorites.find(
    (f) =>
      f.type === "stop_route" &&
      f.appRouteId === route.id &&
      f.stopName === stop.name
  );'''

          if old1 not in text:
              raise SystemExit("Could not find RouteDetail favorite display matcher")
          if old2 not in text:
              raise SystemExit("Could not find RouteDetail favorite toggle matcher")

          text = text.replace(old1, new1, 1)
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/BusScreen.tsx .github/workflows/fix-stop-route-favorite.yml
          git rm .github/workflows/fix-stop-route-favorite.yml
          git commit -m "fix: separate stop favorites by route direction"
          git push
