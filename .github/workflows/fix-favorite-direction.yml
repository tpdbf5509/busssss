name: Fix favorite direction bugs

on:
  push:
    branches:
      - fix/favorite-direction-bugs

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'favorite direction fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n == 0:
                  raise SystemExit(f'Missing target in {path}: {old[:100]!r}')
              if count is not None and n != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new, -1 if count is None else count))

          # RouteDetail/StationDetail must identify a stop favorite by the exact route direction,
          # not merely by the displayed bus number.
          p = Path('src/screens/BusScreen.tsx')
          s = p.read_text()
          s = s.replace(
              'import { resolveNodeId, resolveRouteId } from "@/services/arrivalService";',
              'import { resolveNodeId, resolveRouteId } from "@/services/arrivalService";\nimport { resolveDirections } from "@/services/busLocationService";'
          )

          replace(
              'src/screens/BusScreen.tsx',
              '''  // 실시간 노선 즐겨찾기 여부\n  const isArrivalFavorited = (routeNo: string) =>\n    state.favorites.some(\n      (f) =>\n        f.type === "stop_route" &&\n        f.routeNumber === routeNo &&\n        f.stopName === station.name\n    );\n''',
              '''  // 즐겨찾기는 버스 번호가 아니라 정확한 방향(TAGO routeId/appRouteId)까지 구분합니다.\n  const isArrivalFavorited = (\n    routeNo: string,\n    tagoRouteId?: string,\n    appRouteId?: string\n  ) =>\n    state.favorites.some(\n      (f) =>\n        f.type === "stop_route" &&\n        f.stopName === station.name &&\n        ((!!tagoRouteId && f.tagoRouteId === tagoRouteId) ||\n          (!!appRouteId && f.appRouteId === appRouteId))\n    );\n\n  const findAppRouteForTagoRoute = async (\n    routeNo: string,\n    tagoRouteId: string\n  ): Promise<Route | undefined> => {\n    const candidates =\n      allRoutes?.filter(\n        (r) => r.number === routeNo || r.rawNumber === routeNo\n      ) ?? [];\n\n    for (const candidate of candidates) {\n      try {\n        const directions = await resolveDirections(candidate);\n        if (directions.some((direction) => direction.routeId === tagoRouteId)) {\n          return candidate;\n        }\n      } catch {\n        // 다음 동일 번호 노선을 확인합니다.\n      }\n    }\n\n    return undefined;\n  };\n''',
              1
          )

          replace(
              'src/screens/BusScreen.tsx',
              '''    const existing = state.favorites.find(\n      (f) =>\n        f.type === "stop_route" &&\n        f.routeNumber === sr.routeNo &&\n        f.stopName === station.name\n    );\n''',
              '''    const existing = state.favorites.find(\n      (f) =>\n        f.type === "stop_route" &&\n        f.stopName === station.name &&\n        f.tagoRouteId === sr.routeId\n    );\n''',
              1
          )

          replace(
              'src/screens/BusScreen.tsx',
              '''      const appRoute = allRoutes?.find(\n        (r) =>\n          r.number === sr.routeNo ||\n          r.rawNumber === sr.routeNo\n      );\n''',
              '''      const appRoute = await findAppRouteForTagoRoute(\n        sr.routeNo,\n        sr.routeId\n      );\n''',
              1
          )

          replace(
              'src/screens/BusScreen.tsx',
              '''    const existing = state.favorites.find(\n      (f) =>\n        f.type === "stop_route" &&\n        f.routeNumber === route.number &&\n        f.stopName === station.name\n    );\n''',
              '''    const existing = state.favorites.find(\n      (f) =>\n        f.type === "stop_route" &&\n        f.appRouteId === route.id &&\n        f.stopName === station.name\n    );\n''',
              1
          )

          replace(
              'src/screens/BusScreen.tsx',
              '                            isArrivalFavorited(sr.routeNo)\n',
              '                            isArrivalFavorited(sr.routeNo, sr.routeId)\n',
              1
          )
          replace(
              'src/screens/BusScreen.tsx',
              '                            isArrivalFavorited(route.number)\n',
              '                            isArrivalFavorited(route.number, undefined, route.id)\n',
              1
          )

          replace(
              'src/screens/BusScreen.tsx',
              '''const isArrivalFavorited = (stopName: string) =>\n  state.favorites.some(\n    (f) => f.type === "stop_route" && f.routeNumber === route.number && f.stopName === stopName\n  );\n''',
              '''const isArrivalFavorited = (stopName: string) =>\n  state.favorites.some(\n    (f) =>\n      f.type === "stop_route" &&\n      f.appRouteId === route.id &&\n      f.stopName === stopName\n  );\n''',
              1
          )

          replace(
              'src/screens/BusScreen.tsx',
              '''  const existing = state.favorites.find(\n    (f) => f.type === "stop_route" && f.routeNumber === route.number && f.stopName === stop.name\n  );\n''',
              '''  const existing = state.favorites.find(\n    (f) =>\n      f.type === "stop_route" &&\n      f.appRouteId === route.id &&\n      f.stopName === stop.name\n  );\n''',
              1
          )

          p.write_text(p.read_text())

          # Make the central favorite reducer key route-specific as a second safety net.
          p = Path('src/store/AppContext.tsx')
          s = p.read_text()
          s = s.replace(
              '  | { type: "SYNC_FAVORITE_ROUTE_ID"; id: string; tagoRouteId: string }',
              '  | { type: "SYNC_FAVORITE_ROUTE_ID"; id: string; tagoRouteId: string; appRouteId?: string }'
          )
          s = s.replace(
              'f.id === action.id ? { ...f, tagoRouteId: action.tagoRouteId } : f',
              'f.id === action.id\n              ? { ...f, tagoRouteId: action.tagoRouteId, ...(action.appRouteId ? { appRouteId: action.appRouteId } : {}) }\n              : f'
          )
          p.write_text(s)

          # Existing favorites: when appRouteId is present, keep TAGO routeId aligned to that exact direction.
          # This preserves the previous direction-aware correction while allowing the new UI to use exact keys.
          p = Path('src/screens/HomeScreen.tsx')
          s = p.read_text()
          old = '''  const { data, status } = useArrivalInfo(\n    isStopRoute ? fav.tagoNodeId : undefined,\n    isStopRoute ? fav.tagoRouteId : undefined\n  );\n'''
          new = '''  const { data, status } = useArrivalInfo(\n    isStopRoute ? fav.tagoNodeId : undefined,\n    isStopRoute ? fav.tagoRouteId : undefined\n  );\n'''
          if old not in s:
              raise SystemExit('HomeScreen arrival block changed unexpectedly')
          # Keep the HomeScreen call direction-specific; the actual direction correction is centralized in AppContext.
          p.write_text(s)
          PY

          npm ci
          npm run build

          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/BusScreen.tsx src/store/AppContext.tsx
          git commit -m "fix: separate favorite route directions [favorite direction fix]"
          git push
